name: Android checks

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and lint
        working-directory: Android
        run: bash ./gradlew testDebugUnitTest lintDebug

      - name: Build installable test APK
        working-directory: Android
        run: bash ./gradlew assembleInstallable

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: eye-guardian-installable-apk
          path: Android/app/build/outputs/apk/installable/*.apk
          if-no-files-found: error
